name: Criar APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Xmx4g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Criar Imagens Falsas para o Expo
        run: |
          mkdir -p assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:blue assets/icon.png
          convert -size 512x512 xc:blue assets/adaptive-icon.png
          convert -size 1242x2436 xc:blue assets/splash.png
          convert -size 64x64 xc:blue assets/favicon.png

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Estrutura Android
        run: npx expo prebuild --platform android

      - name: Compilar APK de Depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK de Aniversário
        uses: actions/upload-artifact@v4
        with:
          name: SeuApkDeAniversario
          path: android/app/build/outputs/apk/debug/app-debug.apk
