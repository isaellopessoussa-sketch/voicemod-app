name: Criar APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Criar Imagens Falsas para o Expo
        run: |
          mkdir -p assets
          echo "" > assets/icon.png
          echo "" > assets/splash.png
          echo "" > assets/adaptive-icon.png
          echo "" > assets/favicon.png

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Estrutura Android
        run: npx expo prebuild --platform android --no-interactive

      - name: Compilar APK de Depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK de Aniversário
        uses: actions/upload-artifact@v4
        with:
          name: SeuApkDeAniversario
          path: android/app/build/outputs/apk/debug/app-debug.apk
