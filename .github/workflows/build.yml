name: Criar APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Criar Imagens Falsas para o Expo
        run: |
          mkdir -p assets
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:blue assets/icon.png
          convert -size 512x512 xc:blue assets/adaptive-icon.png
          convert -size 1242x2436 xc:blue assets/splash.png
          convert -size 64x64 xc:blue assets/favicon.png

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Estrutura Android
        run: npx expo prebuild --platform android

      - name: Injetar Configuração de Memória no Android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compilar APK de Depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Enviar APK de Aniversário
        uses: actions/upload-artifact@v4
        with:
          name: SeuApkDeAniversario
          path: android/app/build/outputs/apk/debug/app-debug.apk
