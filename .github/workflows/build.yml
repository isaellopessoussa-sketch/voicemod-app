name: Criar APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      _JAVA_OPTIONS: "-Xmx4g"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Ferramentas de Imagem
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Forçar Criação das Imagens Nativas
        run: |
          mkdir -p assets
          convert -size 512x512 xc:blue assets/icon.png
          convert -size 512x512 xc:blue assets/adaptive-icon.png
          convert -size 1242x2436 xc:blue assets/splash.png
          convert -size 64x64 xc:blue assets/favicon.png

      - name: Instalar Dependências
        run: npm install

      - name: Gerar Pastas Android do Expo
        run: npx expo prebuild --platform android --clean

      - name: Injetar Configurações de Memória do Sistema
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Compilar APK Direto pelo Expo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK para o Celular
        uses: actions/upload-artifact@v4
        with:
          name: AppVoiceModPronto
          path: android/app/build/outputs/apk/debug/app-debug.apk
