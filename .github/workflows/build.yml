name: Criar APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependencias
        run: |
          npm install
          npm install -g react-native-cli

      - name: Gerar Pastas do Android
        run: npx expo prebuild --platform android --template blank || true

      - name: Forçar Criação do Bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file App.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res --config metro.config.js || true

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Enviar APK Pronto
        uses: actions/upload-artifact@v4
        with:
          name: AppModificador
          path: android/app/build/outputs/apk/**/app-*.apk
